name: Daily 1.10 Fixture Generator

on:
  schedule:
    # Runs every day at 09:00 UTC (09:00 GMT)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

permissions:
  contents: write

jobs:
  generate-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

- name: Run fixture generator
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generator.py

      - name: Commit updated pick.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pick.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily 1.10 pick"
          git push
